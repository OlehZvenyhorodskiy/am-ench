# Пример мульти-файла предметов. Каждый ключ сверху = id предмета для /aquaenchant giveitem
# В этом примере только одна руна: runaprobugden

runaprobugden:
  ==: org.bukkit.inventory.ItemStack
  v: 3955
  type: PLAYER_HEAD
  meta:
    ==: ItemMeta
    meta-type: SKULL
    display-name: '&dРуна Исцеления'
    lore:
      - '&7Защищает от отравления'
      - '&7Сокращает длительность эффекта на 50%%'
      - '&7Снижает уровень эффекта отравления'

    # Эти ключи нужны плагину, чтобы понять, что это именно руна пробуждения
    PublicBukkitValues:
      aquaenchats:rune_type: poison_guard
      aquaenchats:rune_unrenamable: "true"
      # Где руна должна лежать, чтобы работала защита:
      #   inventory  - в любом слоте инвентаря
      #   main_hand  - в основной руке
      #   off_hand   - во второй руке
      # Можно перечислять через запятую, например: 'inventory,off_hand'
      aquaenchats:rune_slot: 'inventory'

    # Кастомная текстура головы
    skull-owner:
      ==: PlayerProfile
      uniqueId: 00000000-0000-0000-0000-000000000000
      name: "RunePoisonGuard"
      properties:
      - name: textures
        value: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOTc3YzFmYzkzMjE2ZTk2ZDQzNWNmOTYyZTExNzNkZThkMWEyNDliNjQ0ODk0ZDcyNjc2ZWJhNzMyZmNkNTZlNyJ9fX0=

# Предмет excavator (экскаватор чанка) вынесен в отдельный конфиг:
#   items/excavator.yml
# Там можно менять материал, название, лор и текст голограммы.


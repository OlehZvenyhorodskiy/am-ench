# Конфиг нового предмета-экскаватора для команды /aquaenchant giveitem excavator
# Вы можете менять материал, название, лор и настройки голограммы.

id: excavator

# Материал блока, который ставится в чанке
material: COPPER_BULB

# Отображаемое название предмета
name: '&6ЭКСКАВАТОР'

# Лор предмета
lore:
  - '&7Установи в том чанке, который хочешь раскопать'
  - '&7При установке очищает весь чанк, если не пересекается'
  - '&7с чужими регионами WorldGuard.'

# Дополнительные настройки экскаватора
excavator:
  # Стартовое количество топлива, которое отображается в голограмме
  start-fuel: 0
  # Формат текста голограммы. %fuel% будет заменён на число топлива.
  hologram-text: '&eТопливо: &f%fuel%'

# Здесь при желании можно указать зачарования из enachants.yml,
# чтобы предмет имел красивое свечение:
#enchants:
#  some_enchant_id: 1


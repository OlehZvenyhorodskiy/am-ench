select:
  size: 54
  title: "&6Выбор зачарования"

  # Слот, в котором показывается предмет, с которого снимаем зачарование
  item_slot: 4

  # С какого слота начинают располагаться варианты зачарований (кнопки)
  option_start: 18

  filler:
    material: "GRAY_STAINED_GLASS_PANE"
    name: "&8 "

    # Слоты панели. Можно указывать диапазоны (например "0-3") и отдельные слоты.
    # По умолчанию: 0-3, 5-17 и 26-53.
    slots:
      - "0-3"
      - "5-17"
      # Важно: слот 53 зарезервирован под предмет-стоимость.
      - "26-52"

  # Предмет-стоимость операции (показывается в GUI в отдельном слоте).
  # Сам MATERIAL и AMOUNT берутся из config.yml: separation.currency.material / separation.currency.amount
  cost:
    slot: 53
    name: "&6Базовая цена: &e%amount% &fx %item%"
    lore:
      - "&7Ванильные зачарования: &e%amount% &fx %item%"
      - "&7Кастомные зачарования: &e%amount%&7 x уровень"
      - "&8(например, IV уровень = %amount% x 4)"

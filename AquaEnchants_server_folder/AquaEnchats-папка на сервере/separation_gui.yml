select:
  size: 54
  title: "&6Выбор зачарования"

  # Слот, в котором показывается предмет, с которого снимаем зачарование
  item_slot: 4

  # С какого слота начинают располагаться варианты зачарований (кнопки)
  option_start: 18

  filler:
    material: "GRAY_STAINED_GLASS_PANE"
    name: "&8mc.Aqua-Mix.com"

    # Слоты панели. Можно указывать диапазоны (например "0-3") и отдельные слоты.
    # По умолчанию: 0-3, 5-17 и 26-53.
    slots:
      - "0-3"
      - "5-17"
      - "45-52"
